    <meta name="apple-mobile-web-app-title" content="EventOS" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>EventOS</title>
    <script>
      // Restore path redirected through 404.html (GitHub Pages SPA trick).
      // `path` here is already the full original path from the domain root
      // (e.g. "EventOS/vendor/<token>") — 404.html encoded it that way — so
      // it must NOT be prefixed with the base path again, or routes 404.
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          var path = decodeURIComponent(p[1]);
          var q = path.match(/&q=(.*)/);
          var search = q ? '?' + decodeURIComponent(q[1]) : '';
          path = path.replace(/&q=.*/, '');
          window.history.replaceState(
            null, null,
            '/' + path + search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
